<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Play the novelty judge, replay real DeepSeek votes, and explore the evaluation pipeline."><title>Novelty Lab · 新颖性评委实验室</title><style>:root{--bg:#f4f1e8;--ink:#143042;--teal:#087e78;--orange:#d65e37;--muted:#5d6f76;--line:#d1d9d1;--white:#fffef9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:4px}header{padding:23px 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:26px;font-weight:800;letter-spacing:-1px}.brand span{font-weight:400}.brand b{color:var(--teal)}.actions{display:flex;gap:10px;flex-wrap:wrap}.quiet{background:transparent;border:1px solid var(--line);border-radius:24px;padding:10px 16px}main{max-width:1280px;margin:auto;padding:0 4vw 50px}.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center;padding:45px 0 30px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;color:var(--teal)}h1{font-size:clamp(36px,4.7vw,64px);letter-spacing:-.05em;line-height:1.12;margin:18px 0}h1 em{font-style:normal;color:var(--orange)}.lead{font-size:17px;line-height:1.8;color:var(--muted);max-width:660px}.hero svg{width:100%;height:auto}.float{animation:float 6s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px)}}nav{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:28px}nav button{border:0;border-bottom:3px solid transparent;background:none;padding:17px 20px 17px 0;margin-right:25px;color:var(--muted);font-weight:650}nav button.active{border-color:var(--orange);color:var(--ink)}nav small{color:var(--orange);margin-right:10px}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:23px}h2{font-size:27px;letter-spacing:-.03em;line-height:1.35;margin:0 0 8px}.sub,.note{font-size:13px;line-height:1.7;color:var(--muted);margin:0}.note{font-size:12px;margin:20px 0}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}select{padding:10px;background:transparent;border:1px solid var(--line);border-radius:8px;max-width:200px}.counter{color:var(--muted);font-size:13px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px}.idea{border:1px solid var(--line);background:var(--white);border-radius:18px;padding:25px;transition:border-color .2s}.idea.selected{border:2px solid var(--teal);padding:24px}.letter{font-size:12px;letter-spacing:2px;font-weight:750;color:var(--teal)}h3{font-size:22px;line-height:1.4;letter-spacing:-.03em;margin:16px 0 10px}.brief{color:var(--muted);line-height:1.7;font-size:16px;min-height:80px;margin-bottom:20px}.choose{border:1px solid var(--ink);background:none;border-radius:8px;padding:12px;width:100%;font-weight:600}.selected .choose{background:var(--ink);color:var(--white)}details{color:var(--muted);font-size:13px;margin-top:17px}summary{cursor:pointer}.full{font-size:14px;line-height:1.7}.game-action{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:24px 0}.primary{border:0;border-radius:9px;background:var(--orange);color:white;font-weight:700;padding:14px 24px;box-shadow:0 5px 0 #a94527}.primary:active{transform:translateY(2px);box-shadow:0 3px 0 #a94527}.hint{font-size:13px;color:var(--muted)}.result{padding:25px 28px;background:#e5ede6;border-radius:17px;margin-bottom:20px}.row{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}.question{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:14px}.verdict{font-size:26px;letter-spacing:-.03em;font-weight:750}.votes{display:flex;gap:7px;flex-wrap:wrap}.vote{width:34px;height:38px;border-radius:7px;display:grid;place-items:center;color:white;background:var(--ink);animation:pop .35s both;animation-delay:calc(var(--i)*65ms)}.vote.b{background:var(--orange)}@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.predict{border-top:1px solid #c3d2c8;margin-top:22px;padding-top:15px}.guess{border:1px solid var(--ink);border-radius:8px;padding:10px 15px;background:transparent;margin:0 8px 8px 0}.feedback{font-size:20px;font-weight:700;line-height:1.5;margin-top:20px}.explain{font-size:14px;line-height:1.8;color:var(--muted);margin:14px 0}.barrow{display:flex;gap:15px;align-items:center;font-size:14px;margin-top:13px}.track{height:13px;border-radius:10px;background:#c9d6cd;flex:1;overflow:hidden}.fill{height:100%;background:var(--teal);transition:width .5s}.lab-grid{display:grid;grid-template-columns:300px 1fr;gap:30px}.settings{display:grid;gap:10px;align-content:start}.rule{text-align:left;padding:18px;border:1px solid var(--line);border-radius:12px;background:none}.rule.active{border-color:var(--teal);background:#e5ede6}.rule strong{display:block;margin-bottom:7px;font-size:17px}.rule span{font-size:13px;line-height:1.5;color:var(--muted)}.lab-box{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:28px}.big{font-size:58px;letter-spacing:-.05em;font-weight:750;color:var(--teal);margin:20px 0 5px}.chart{display:flex;gap:25px;align-items:flex-end;height:160px;border-bottom:1px solid var(--line);margin:50px 0 40px;padding:0 10px}.col{flex:1;background:var(--teal);border-radius:7px 7px 0 0;position:relative;transition:height .6s}.col:nth-child(2){background:var(--orange)}.col:nth-child(3){background:var(--ink)}.col strong{position:absolute;top:-28px;width:100%;text-align:center;font-size:14px}.col small{position:absolute;bottom:-25px;width:100%;text-align:center;color:var(--muted);font-size:12px}.modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.modes button{background:none;border:1px solid var(--line);border-radius:25px;padding:10px 17px}.modes .active{background:var(--ink);color:white;border-color:var(--ink)}.flowbox{padding:18px;background:var(--white);border:1px solid var(--line);border-radius:18px}.flowbox svg{display:block;width:100%;height:auto}.flow-controls{margin:20px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.detail{font-size:17px;line-height:1.8;color:var(--muted);min-height:65px}.present .hero{display:none}.present header{padding:15px 5vw}.present main{padding-top:15px}footer{padding:26px 5vw;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}footer a{color:inherit}[hidden]{display:none!important}@media(max-width:760px){header{padding:18px 5vw}.brand{font-size:22px}.actions button{font-size:12px;padding:8px 12px}.hero{grid-template-columns:1fr;padding-top:28px}.hero svg{display:none}h1{font-size:42px}.head{flex-direction:column}.pair,.lab-grid{grid-template-columns:1fr}.brief{min-height:0}.settings{grid-template-columns:1fr 1fr}.rule{padding:12px}.flowbox{padding:4px}.flowbox svg{min-height:200px}nav button{font-size:13px;margin-right:10px}.vote{width:29px;height:33px}.result{padding:20px}.big{font-size:45px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><header><div class="brand"><b>◒</b> novelty<span>lab</span></div><div class="actions"><button class="quiet" id="lang">EN / 中文</button><button class="quiet" id="present" data-zh="演示模式" data-en="Presentation mode">演示模式</button></div></header><main><section class="hero"><div><div class="eyebrow">AN EXPERIMENT YOU CAN PLAY</div><h1><span data-zh="同一个想法，换个问法，" data-en="Same ideas. New question.">同一个想法，换个问法，</span><em data-zh="赢家会变吗？" data-en="A different winner?">赢家会变吗？</em></h1><p class="lead" data-zh="当AI给出一堆研究想法，我们可能再请一个AI挑出最新颖的。先别急着相信它——来当一回评委。" data-en="An AI generates research ideas. Another chooses the most novel. Before trusting that reviewer, try being the judge yourself."></p></div><svg viewBox="0 0 450 280" aria-hidden="true"><ellipse cx="225" cy="242" rx="155" ry="13" fill="#e0e7df"/><circle cx="225" cy="126" r="103" fill="#e5ece4"/><g class="float"><rect x="57" y="83" width="87" height="117" rx="10" fill="#fffef9" stroke="#bccdc6" transform="rotate(-12 100 140)"/><text x="88" y="135" font-size="33" fill="#087e78" font-family="Arial" font-weight="bold">A</text><path d="M80 153h38m-38 10h29" stroke="#a4b6b4" stroke-width="3"/><rect x="307" y="72" width="87" height="117" rx="10" fill="#fffef9" stroke="#bccdc6" transform="rotate(12 350 130)"/><text x="335" y="127" font-size="33" fill="#d65e37" font-family="Arial" font-weight="bold">B</text><path d="M326 146h38m-38 10h29" stroke="#a4b6b4" stroke-width="3"/></g><path d="M225 77v-18m-8 0h16" stroke="#143042" stroke-width="4"/><rect x="168" y="81" width="114" height="91" rx="25" fill="#143042"/><rect x="180" y="99" width="90" height="42" rx="17" fill="#f4f1e8"/><circle cx="204" cy="119" r="7" fill="#087e78"/><circle cx="246" cy="119" r="7" fill="#d65e37"/><path d="M208 154h34" stroke="#f4f1e8" stroke-width="4" stroke-linecap="round"/><path d="M207 177v44m36-44v44m-59 3h36m11 0h36" stroke="#143042" stroke-width="9" stroke-linecap="round"/><path d="M160 119l-15 12m145-12 15 12" stroke="#143042" stroke-width="6" stroke-linecap="round"/><text x="225" y="45" font-family="Arial" font-size="25" fill="#d65e37" text-anchor="middle">?</text></svg></section><nav aria-label="Sections"><button class="active" data-tab="game" aria-selected="true"><small>01</small><span data-zh="你来当评委" data-en="Be the judge"></span></button><button data-tab="lab" aria-selected="false"><small>02</small><span data-zh="规则实验室" data-en="Rule laboratory"></span></button><button data-tab="flow" aria-selected="false"><small>03</small><span data-zh="会动的实验流程" data-en="The research flow"></span></button></nav>
<section id="game"><div class="head"><div><h2 data-zh="你觉得哪条研究想法更新颖？" data-en="Which research idea do you think is more novel?"></h2><p class="sub" data-zh="第1步：选你觉得更有原创性的想法。第2步：猜AI换问法后会不会改判。积分只看第2步。" data-en="Step1: choose the idea you find more original. Step2: predict what the AI does after rewording. Only step2 is scored."></p></div><div class="controls"><select id="case" aria-label="Case"></select><span id="score" class="counter"></span><button class="quiet" id="swap" data-zh="交换展示位置" data-en="Swap cards"></button></div></div><div class="pair" id="pair"><article class="idea" id="idea-a"><div class="letter">IDEA A · 0</div><h3 id="title-a"></h3><p class="brief" id="brief-a"></p><button class="choose" id="choose-a" data-zh="我认为A更新颖" data-en="I think A is more novel"></button><details><summary data-zh="模型收到的完整原文" data-en="Full original input"></summary><p class="full" id="full-a"></p></details></article><article class="idea" id="idea-b"><div class="letter">IDEA B · 1</div><h3 id="title-b"></h3><p class="brief" id="brief-b"></p><button class="choose" id="choose-b" data-zh="我认为B更新颖" data-en="I think B is more novel"></button><details><summary data-zh="模型收到的完整原文" data-en="Full original input"></summary><p class="full" id="full-b"></p></details></article></div><div class="game-action"><button class="primary" id="reveal" disabled data-zh="揭晓AI的第一轮选择" data-en="Reveal the first decision"></button><span class="hint" id="hint"></span></div><div class="result" id="result" hidden aria-live="polite"><div class="question" id="q3"></div><div class="row"><div class="verdict" id="v3"></div><div class="votes" id="votes3"></div></div><div class="predict" id="predict"><p data-zh="换成直接问“哪条新颖”，AI会怎样？" data-en="If we now ask directly which idea is novel, what happens?"></p><button class="guess" data-guess="same" data-zh="同一个赢家" data-en="Same winner"></button><button class="guess" data-guess="flip" data-zh="换一个赢家" data-en="Different winner"></button><button class="guess" data-guess="tie" data-zh="至少一轮平局" data-en="A tie in either round"></button></div><div id="second" hidden><div class="question" id="q4" style="margin-top:25px"></div><div class="row"><div class="verdict" id="v4"></div><div class="votes" id="votes4"></div></div><div id="bars"></div><div class="feedback" id="feedback"></div><p class="explain" id="explain"></p><div class="controls"><button class="quiet" id="next" data-zh="下一个真实案例 →" data-en="Next real case →"></button><button class="quiet" id="reset" data-zh="重玩本案例" data-en="Replay this case"></button></div></div></div><p class="note" data-zh="精选案例包含改判、不变和平局，不能估计总体翻转率。标签是继承的参考，尤其AI生成负例属于弱假设；稳定也不等于正确。" data-en="Selected cases include stable, changed and tied decisions, not a population flip-rate estimate. Inherited labels are imperfect, especially for generated negatives. Stability does not imply correctness."></p></section>
<section id="lab" hidden><div class="head"><div><h2 data-zh="只改一条规则，看看结果怎么变。" data-en="Change one rule. Inspect the result."></h2><p class="sub" data-zh="已经完成的真实实验数据，没有调用新模型。" data-en="Completed experiment data, without new model calls."></p></div></div><div class="lab-grid"><div class="settings"><button class="rule active" data-rule="prompt"><strong data-zh="换提问方式" data-en="Change the question"></strong><span data-zh="相同154对想法，不同提示词。" data-en="Same154 pairs, different instructions."></span></button><button class="rule" data-rule="votes"><strong data-zh="重复投票" data-en="Repeat the vote"></strong><span data-zh="每种顺序1票或3票。" data-en="One or three votes per order."></span></button><button class="rule" data-rule="format"><strong data-zh="换成研究计划" data-en="Use a research plan"></strong><span data-zh="摘要，或目标＋机制。" data-en="Abstract versus goal + mechanism."></span></button><button class="rule" data-rule="source"><strong data-zh="换想法生成器" data-en="Change the idea generator"></strong><span data-zh="DeepSeek评委不变。" data-en="DeepSeek remains the judge."></span></button></div><div class="lab-box"><div class="eyebrow" data-zh="已完成实验 · 真实数据" data-en="COMPLETED EXPERIMENT · REAL DATA"></div><div class="big" id="number"></div><div class="sub" id="number-label"></div><div class="chart" id="chart"></div><h3 id="takeaway"></h3><p class="explain" id="lab-explain"></p></div></div><p class="note" data-zh="纵轴：成对判决与基准的一致率，平局计0。P3预测评审判断，P4直接判断新颖性，框架与目标也有区别。" data-en="Pairwise agreement with benchmark labels; ties score zero. P3 predicts reviewers’ judgments, while P4 assesses novelty directly, so framing and target differ."></p></section>
<section id="flow" hidden><div class="head"><div><h2 data-zh="把研究过程连起来。" data-en="See how the research fits together."></h2><p class="sub" data-zh="点击节点，或者逐步播放。可下载SVG用于PPT。" data-en="Select a node or step through. Download SVG diagrams for slides."></p></div></div><div class="modes"><button class="active" data-flow="study" data-zh="原文受控实验" data-en="Controlled study"></button><button data-flow="application" data-zh="AI科研中用在哪里" data-en="Use in AI research"></button><button data-flow="future" data-zh="我的后续研究设想" data-en="My proposed study"></button></div><div class="flowbox" id="flowbox"></div><div class="flow-controls"><button class="primary" id="flow-next" data-zh="下一步" data-en="Next step"></button><button class="quiet" id="play" data-zh="自动播放" data-en="Auto play"></button><button class="quiet" id="flow-reset" data-zh="回到起点" data-en="Start again"></button><button class="quiet" id="download" data-zh="下载流程图SVG" data-en="Download SVG"></button><span id="step-count" class="counter"></span></div><p class="detail" id="detail" aria-live="polite"></p></section></main><footer><span>Nuozhou Wang · XJTLU · Novelty evaluation</span><span><a href="https://github.com/Viego051115/novelty-eval-replication" target="_blank" rel="noopener">Experiment records ↗</a> · <span data-zh="离线运行 · 无API费用" data-en="Runs offline · No API charges"></span></span></footer><script>const DATA={"cases": [{"row": 1, "id": "1", "a": {"brief": ["协作画图的AI代理", "分析数据、规划图表、编写代码，再检查和改进图表。", "Collaborative chart agents", "Inspect data, plan a chart, write code and refine the visualization."], "full": "Deep research has revolutionized data analysis, yet data scientists still devote substantial time to manually crafting visualizations, highlighting the need for robust automation from natural language queries. However, current systems struggle with complex datasets containing multiple files and iterative refinement. Existing approaches, including simple single- or multi-agent systems, often oversimplify the task, focusing on initial query parsing while failing to robustly manage data complexity, code errors, or final visualization quality. In this paper, we reframe this challenge as a collaborative multi-agent problem. We introduce CoDA, a multi-agent system that employs specialized LLM agents for metadata analysis, task planning, code generation, and self-reflection. We formalize this pipeline, demonstrating how metadata-focused analysis bypasses token limits and quality-driven refinement ensures robustness. This work demonstrates that the future of visualization automation lies not in isolated code generation but in integrated, collaborative agentic workflows.", "title": "CoDA: Agentic Systems for Collaborative Data Visualization"}, "b": {"brief": ["可更新知识的模型", "找出一条事实对应的模型参数，一致地修改它，并尽量避免遗忘。", "Editable model knowledge", "Trace the weights behind a fact and edit knowledge consistently without forgetting."], "full": "Foundation models encode vast knowledge within their parameters, yet they remain fundamentally static artifacts that cannot efficiently adapt to new information, correct outdated facts, or refine erroneous beliefs without costly retraining. We introduce Neural Knowledge Substrates, a framework that reimagines foundation model weights as dynamically editable knowledge repositories with principled update mechanisms. Our approach combines three key components: (1) a causal tracing methodology that identifies minimal parameter subsets responsible for specific factual or reasoning behaviors, (2) a consistency-preserving editing operator that performs targeted weight updates while maintaining logical coherence across related knowledge, and (3) a meta-learning protocol that enables models to learn how to assimilate new information without catastrophic forgetting. Unlike existing model editing techniques that treat updates as isolated interventions, our framework enforces compositional consistency constraints and propagates changes through knowledge dependency graphs. This enables foundation models to evolve continuously, incorporating new discoveries, correcting misinformation, and refining their world models while preserving their general capabilities—transforming them from static artifacts into living knowledge systems.", "title": "LLM-foundation or frontier models, including LLMs-12"}, "expected": 0, "p3": {"i": 1, "pred": 0, "votes": [0, 0, 0, 1, 0, 0], "expected": 0}, "p4": {"i": 1, "pred": 1, "votes": [1, 1, 1, 0, 0, 0], "expected": 0}}, {"row": 2, "id": "2", "a": {"brief": ["为长文本节省显存", "利用注意力中的频率信息判断哪些词最重要，只保留关键内容。", "Memory-efficient long context", "Use frequency information in attention to identify and retain important tokens."], "full": "The deployment of Large Language Models (LLMs) faces a critical bottleneck when handling lengthy inputs: the prohibitive memory footprint of the Key Value (KV) cache. To address this bottleneck, the token pruning paradigm leverages attention sparsity to selectively retain a small, critical subset of tokens. However, existing approaches fall short, with static methods risking irreversible information loss and dynamic strategies employing heuristics that insufficiently capture the query-dependent nature of token importance. We propose FASA, a novel framework that achieves query-aware token eviction by dynamically predicting token importance. FASA stems from a novel insight into RoPE: the discovery of functional sparsity at the frequency-chunk (FC) level. Our key finding is that a small, identifiable subset of \"dominant\" FCs consistently exhibits high contextual agreement with the full attention head. This provides a robust and computationally free proxy for identifying salient tokens. Building on this insight, FASA first identifies a critical set of tokens using dominant FCs, and then performs focused attention computation solely on this pruned subset.", "title": "FASA: FREQUENCY-AWARE SPARSE ATTENTION"}, "b": {"brief": ["有选择地学习新知识", "学习哪些模型部件可以更新，哪些应保持稳定，以吸收新信息。", "Selective knowledge updates", "Learn which model components should change and which should stay stable."], "full": "Foundation models excel at leveraging pre-trained knowledge but struggle to incorporate new information after deployment without costly retraining or architectural modifications. We introduce Selective Neuroplasticity Networks (SNNs), a framework that enables large language models to dynamically assimilate streaming information while preserving their foundational capabilities. Our approach learns a meta-policy that identifies which model components—specific attention heads, feed-forward layers, or parameter subspaces—should adapt to new knowledge versus remain stable. By modeling knowledge integration as a routing problem within the transformer architecture, SNNs create dedicated pathways for new information that minimally interfere with existing representations. The meta-policy is trained via bi-level optimization to maximize both knowledge retention and integration across diverse continual learning scenarios. Unlike retrieval-augmented generation, which maintains external memory, our method internalizes new knowledge directly into model weights through selective, localized updates. This enables foundation models to evolve continuously in deployment, adapting to temporal shifts, user-specific contexts, and private data streams while maintaining their broad pre-trained capabilities across standard benchmarks.", "title": "LLM-foundation or frontier models, including LLMs-14"}, "expected": 0, "p3": {"i": 2, "pred": 0, "votes": [0, 0, 0, 0, 0, 1], "expected": 0}, "p4": {"i": 2, "pred": 0, "votes": [0, 0, 0, 0, 0, 1], "expected": 0}}, {"row": 0, "id": "0", "a": {"brief": ["按词的重要性调整训练", "结合梯度和位置先验加权训练，再让模型更接近人类偏好的回答。", "Token-weighted preference training", "Weight tokens using gradient attribution and a prior, then optimize toward preferred answers."], "full": "Aligning Large Language Models (LLMs) with human preferences is crucial for safe and effective AI interactions. While popular methods like Direct Preference Optimization (DPO) have simplified alignment, they remain sensitive to data noise and overlook the differential importance of individual tokens. Existing token-level approaches often rely on probability prediction or simplistic weighting schemes to obtain token importance, which still cannot fully address these issues. To solve this problem, we propose the Token-Importance Guided Direct Preference Optimization (TI-DPO), a framework that achieves fine-grained semantic control through two synergistic innovations. First, we propose a novel hybrid weighting mechanism that combines gradient attribution with a Gaussian prior, ensuring both the accuracy and robustness of token importance scores. Second, we employ a triplet loss to provide structured guidance for the optimization, explicitly guiding model outputs to approach preferred responses and diverge from non-preferred ones.", "title": "Token-Importance Guided Direct Preference Optimization"}, "b": {"brief": ["带时间标签的知识模块", "用轻量适配模块存放不同时段的知识，再动态选择和组合这些模块。", "Time-indexed knowledge modules", "Store new knowledge in lightweight time-indexed adapters and compose them dynamically."], "full": "Foundation models exhibit remarkable capabilities but remain static after pretraining, unable to efficiently incorporate emerging knowledge without expensive retraining or catastrophic forgetting. We introduce Temporal Knowledge Anchoring (TKA), a framework that enables continual knowledge integration in large language models through geometrically-constrained adapter composition. TKA maintains a library of lightweight, temporally-indexed adapter modules, each encoding knowledge from specific time periods or domains. During inference, relevant adapters are dynamically selected and composed using a learned routing mechanism that balances new information integration with preservation of foundational capabilities. The key innovation lies in our geometric anchoring loss, which constrains adapter parameters to lie within specific regions of weight space that provably bound interference with pre-existing knowledge. This allows models to accumulate knowledge over time while maintaining backward compatibility. Unlike retrieval-augmented approaches, TKA internalizes knowledge updates directly into model parameters, enabling efficient inference without external databases. The framework supports both supervised updates from curated sources and self-supervised learning from streaming data, offering a path toward truly evolving foundation models.", "title": "LLM-foundation or frontier models, including LLMs-11"}, "expected": 0, "p3": {"i": 0, "pred": 1, "votes": [1, 1, 1, 0, 0, 0], "expected": 0}, "p4": {"i": 0, "pred": 1, "votes": [1, 0, 1, 0, 0, 0], "expected": 0}}, {"row": 11, "id": "12", "a": {"brief": ["阻止错误在AI之间滚雪球", "传递关键视觉信息并调整注意力，减少一个代理看错后影响其他代理。", "Stop errors spreading across agents", "Relay selected visual evidence and reallocate attention to reduce cascading hallucinations."], "full": "Multi-Agent System (MAS) powered by Visual Language Models (VLMs) enables challenging tasks but suffers from a novel failure term, multi-agent visual hallucination snowballing, where hallucinations are seeded in a single agent and amplified by following ones due to the over-reliance on textual flow to relay visual information. Through turn-, layer-, and token-wise attention analyses, we provide detailed insights into the essence of hallucination snowballing regarding the reduction of visual attention allocation. It leads us to identify a subset of vision tokens with a unimodal attention peak in middle layers that best preserve visual evidence but gradually diminish in deeper agent turns, resulting in the visual hallucination snowballing in MAS. Thus, we propose ViF, a lightweight, model-agnostic mitigation paradigm that relays inter-agent messages with Visual Flow powered by the selected visual relay tokens and applies attention reallocation to amplify this pattern.", "title": "Visual Multi-Agent System: Mitigating Hallucination Snowballing via Visual Flow"}, "b": {"brief": ["让模型学出符号推理", "加入可微分瓶颈，让模型自行形成可组合的符号单元。", "Emergent symbolic reasoning", "Use a differentiable bottleneck to encourage reusable symbolic reasoning primitives."], "full": "We propose Neural Symbolic Emergence (NSE), a novel architecture that enables large language models to learn compositional symbolic reasoning capabilities through emergent internal representations. Rather than imposing predefined symbolic structures, NSE introduces a differentiable bottleneck layer that encourages the model to self-organize discrete, reusable symbolic primitives during standard pretraining. These learned symbols can be dynamically composed and manipulated through attention-based operations that mirror classical symbolic reasoning while remaining fully integrated within the neural framework. The architecture combines continuous representation learning with discrete bottleneck constraints, allowing symbols to emerge naturally from data patterns rather than human specification. By maintaining end-to-end differentiability, NSE preserves the scalability and flexibility of foundation models while enhancing systematic generalization on tasks requiring multi-hop reasoning, logical consistency, and compositional understanding. This approach bridges neural and symbolic paradigms without requiring explicit symbolic supervision, offering a path toward more robust and interpretable reasoning in future foundation models.", "title": "LLM-foundation or frontier models, including LLMs-7"}, "expected": 0, "p3": {"i": 11, "pred": 0, "votes": [0, 0, 0, 1, 1, 1], "expected": 0}, "p4": {"i": 11, "pred": null, "votes": [0, 1, 0, 0, 0, 1], "expected": 0}}, {"row": 6, "id": "6", "a": {"brief": ["检查强化训练是否让AI过早冒险", "比较不同训练方法，发现平均表现提高也可能伴随过早放弃探索。", "When training makes agents too greedy", "Study how training can improve average performance while making agents abandon exploration too early."], "full": "While Large Language Models (LLMs) hold promise to become autonomous agents, they often explore suboptimally in sequential decision-making. Recent work has sought to enhance this capability via supervised fine-tuning (SFT) or reinforcement learning (RL), improving regret on the classic multi-armed bandit task. However, it remains unclear how these learning methods shape exploration strategies and how well they generalize. We investigate both paradigms by training LLMs with SFT on expert trajectories and RL with a range of tailored reward signals including a strategic, regret-shaped reward to reduce variance, and an algorithmic reward that enables oracle imitation. Behavioral analysis reveals that gains often stem from more sophisticated but greedier exploitation: RL/SFT agents are more prone to early catastrophic failure than pre-trained models, prematurely abandoning exploration. Furthermore, agents trained to imitate UCB learn to outperform their teacher by adopting more exploitative variants. Our findings clarify when each training paradigm is preferable and advocate tailored reward design and evaluation beyond average regret to promote robust exploratory behavior.", "title": "When Greedy Wins: Emergent Exploitation Bias in Meta-Bandit LLM Training"}, "b": {"brief": ["给模型可组合的推理部件", "通过对比训练、干预和路由，让模型组合可复用的推理操作。", "Composable reasoning components", "Combine contrastive training, interventions and routing to learn reusable reasoning operations."], "full": "Foundation models demonstrate impressive capabilities yet lack interpretable, compositional reasoning structures. We propose Modular Reasoning Primitives (MRP), a framework for training large language models to develop explicit, reusable reasoning components that can be flexibly composed across diverse cognitive tasks. Rather than learning monolithic task-specific behaviors, MRP introduces architectural constraints and specialized pre-training objectives that encourage the emergence of atomic reasoning operations—such as deductive inference, analogical mapping, and causal attribution—as discrete, steerable modules within the model's computation graph. Our approach combines contrastive learning over reasoning traces, intervention-based training that isolates individual reasoning steps, and a routing mechanism that dynamically selects and chains appropriate primitives for each query. This modular structure enables systematic generalization to novel reasoning compositions, provides interpretable intermediate states for analysis and debugging, and allows targeted improvement of specific reasoning capabilities without full model retraining. MRP represents a step toward foundation models with human-aligned cognitive architectures.", "title": "LLM-foundation or frontier models, including LLMs-2"}, "expected": 0, "p3": {"i": 6, "pred": 0, "votes": [0, 0, 0, 0, 0, 1], "expected": 0}, "p4": {"i": 6, "pred": 1, "votes": [1, 1, 1, 0, 0, 0], "expected": 0}}, {"row": 4, "id": "4", "a": {"brief": ["小模型也能学推理", "筛选和重采样高质量训练数据，探索较小模型与较少数据能否形成推理能力。", "Reasoning with smaller models", "Curate and resample high-quality data to study reasoning in sub-billion-parameter models."], "full": "The paradigm shift in large language models (LLMs) from instinctive responses to chain-of-thought (CoT) reasoning has fueled two prevailing assumptions: (1) reasoning capabilities only emerge in sufficiently large models, and (2) such capabilities require training on massive datasets. While the first assumption has already been challenged by recent sub-billion-parameter reasoning models such as Qwen3-0.6B and DeepSeek distilled variants, the second remains largely unquestioned. In this work, we revisit the necessity of scaling to extremely large corpora (>10T tokens) for reasoning emergence. By carefully curating and resampling open-source datasets that we identify as beneficial under our designed metrics, we demonstrate that strong reasoning abilities can emerge with far less data. Specifically, we show that only ~2T tokens of high-quality data are sufficient, and pre-training with 4.2T tokens on the dataset resampled from these ~2T tokens, followed by an established post-training procedure, enables the development of MobileLLM-R1, a series of sub-billion-parameter reasoning models. To facilitate further research in this direction, we have made the models and code publicly available, along with the complete training recipe, data sources, and data mixing ratios.", "title": "MobileLLM-R1: Exploring the Limits of Sub-Billion Language Model Reasoners with Open Training Recipes"}, "b": {"brief": ["给模型嫁接知识", "添加可独立组合的小模块，让模型吸收新知识而不必整体重训。", "Grafting new knowledge", "Compose lightweight knowledge-update modules rather than retraining the entire model."], "full": "Foundation models require frequent updates to incorporate new knowledge, correct errors, and adapt to evolving domains, yet full-scale retraining remains computationally prohibitive. We introduce Compositional Model Grafting, a framework that enables surgical updates to foundation models through dynamically composable knowledge modules. Rather than fine-tuning monolithic parameters, our approach learns lightweight graft modules—small neural components encoding specific knowledge updates—alongside a compositional router that learns to invoke and combine grafts based on input context. The router employs a structured attention mechanism over a library of grafts, enabling systematic generalization through explicit composition of atomic knowledge units. Grafts can be added, removed, or modified independently without affecting the base model or other modules, preventing catastrophic forgetting while supporting continuous knowledge injection. This modular architecture naturally handles conflicting updates through learned routing policies and enables interpretable attribution of model outputs to specific knowledge sources, addressing key challenges in foundation model maintenance and governance.", "title": "LLM-foundation or frontier models, including LLMs-10"}, "expected": 0, "p3": {"i": 4, "pred": 1, "votes": [1, 1, 0, 0, 1, 0], "expected": 0}, "p4": {"i": 4, "pred": 1, "votes": [1, 0, 1, 0, 0, 0], "expected": 0}}, {"row": 5, "id": "5", "a": {"brief": ["一边学词一边学概念", "在预测下一个词的同时，预测连续概念，并把概念混入内部表示。", "Learning tokens and concepts", "Combine next-token prediction with continuous concepts mixed into hidden representations."], "full": "Next token prediction has been the standard training objective used in large language model pretraining. Representations are learned as a result of optimizing for token-level perplexity. We propose Continuous Concept Mixing (CoCoMix), a novel pretraining framework that combines discrete next token prediction with continuous concepts. Specifically, CoCoMix predicts \"continuous concepts\" learned from a pretrained sparse autoencoder and mixes them into the model's hidden state by interleaving with token hidden representations. We find that combining both concept learning and interleaving in an end-to-end framework is critical to performance gains. Furthermore, CoCoMix enhances interpretability and steerability by allowing direct inspection and modification of the predicted concept, offering a transparent way to guide the model's internal reasoning process.", "title": "LLM Pretraining with Continuous Concepts"}, "b": {"brief": ["给模型符号草稿纸", "让模型在推理时建立知识图谱、约束或逻辑结构，辅助可检查的推理。", "A symbolic scratchpad", "Construct symbolic structures such as graphs and constraints during reasoning."], "full": "We introduce Neurosymbolic Scaffolding, a framework that augments foundation models with the ability to dynamically construct and reason over explicit symbolic structures during inference. While large language models excel at pattern recognition and generation, they struggle with tasks requiring verifiable logical reasoning, systematic composition, and adherence to formal constraints. Our approach addresses this by introducing a lightweight learned module that enables models to externalize intermediate reasoning steps into structured symbolic representations—including knowledge graphs, constraint satisfaction problems, and logic programs—while maintaining end-to-end differentiability. The symbolic scaffold operates as a scratchpad where the model can perform explicit operations guided by learned policies, bridging the gap between neural fluency and symbolic rigor. Through parameter-efficient adaptation, we integrate this capability into pre-trained foundation models without full retraining. This neurosymbolic extension enables provable correctness guarantees, interpretable reasoning traces, and natural incorporation of domain expertise through symbolic constraints, while preserving the models' general-purpose capabilities and scaling properties. Our framework opens new possibilities for trustworthy AI systems that combine the flexibility of neural networks with the verifiability of symbolic reasoning.", "title": "LLM-foundation or frontier models, including LLMs-4"}, "expected": 0, "p3": {"i": 5, "pred": 0, "votes": [0, 0, 0, 1, 1, 1], "expected": 0}, "p4": {"i": 5, "pred": 0, "votes": [0, 0, 0, 1, 1, 1], "expected": 0}}, {"row": 7, "id": "7", "a": {"brief": ["让模型边推理边自检", "用生成与验证两条处理流，同时产出推理步骤并检查其中的问题。", "Reasoning with self-checks", "Couple generation and verification streams to check intermediate reasoning."], "full": "We introduce Reflexive Reasoning Networks, a framework that endows large language models with internalized verification capabilities for multi-step reasoning tasks. Rather than relying on external verifiers or outcome-based supervision, our approach trains models to simultaneously generate reasoning traces and evaluate their logical coherence through a dual-stream architecture. A generation stream produces step-by-step solutions while a verification stream assesses intermediate steps for logical consistency, factual accuracy, and relevance. These streams are coupled through a contrastive objective that encourages the model to distinguish valid reasoning paths from subtly flawed alternatives generated through controlled perturbations of its own outputs. Crucially, verification signals emerge from the model's internal representations rather than external labels, enabling sample-efficient learning of metacognitive skills. The framework operates through iterative refinement loops where verification assessments guide selective regeneration of problematic reasoning steps. This approach bridges the gap between current foundation models' generative capabilities and the self-corrective reasoning exhibited by human experts, opening pathways toward more reliable and interpretable AI systems.", "title": "LLM-foundation or frontier models, including LLMs-17"}, "b": {"brief": ["让AI代理按成本交易信息", "把不确定性分成可交换的信息，由协调者决定何时合作更划算。", "A market for agent information", "Coordinate agents by trading structured uncertainty under explicit cost considerations."], "full": "Vision-Language Models (VLMs) enable powerful multi-agent systems, but scaling them is economically unsustainable: coordinating heterogeneous agents under information asymmetry often spirals costs. Existing paradigms, such as Mixture-of-Agents and knowledge-based routers, rely on heuristic proxies that ignore costs and collapse uncertainty structure, leading to provably suboptimal coordination.\nWe introduce Agora, a framework that reframes coordination as a decentralized market for uncertainty. Agora formalizes epistemic uncertainty into a structured, tradable asset (perceptual, semantic, inferential), and enforces profitability-driven trading among agents based on rational economic rules. A market-aware broker, extending Thompson Sampling, initiates collaboration and guides the system toward cost-efficient equilibria. Agora establishes market-based coordination as a principled and scalable paradigm for building economically viable multi-agent visual intelligence systems.", "title": "Why Keep Your Doubts to Yourself? Trading Visual Uncertainties among Vision-Language Models"}, "expected": 1, "p3": {"i": 7, "pred": 1, "votes": [1, 1, 1, 0, 0, 0], "expected": 1}, "p4": {"i": 7, "pred": 1, "votes": [0, 1, 1, 0, 0, 0], "expected": 1}}, {"row": 8, "id": "8", "a": {"brief": ["修正视觉与文字的不平衡", "分析图像与文字特征尺度不一致造成的信息损失，并用归一化层对齐。", "Aligning image and text features", "Analyze scale mismatch between visual and text tokens, then align them with normalization."], "full": "Multimodal Large Language Models (MLLMs), which couple pre-trained vision encoders and language models, have shown remarkable capabilities. However, their reliance on the ubiquitous Pre-Norm architecture introduces a subtle yet critical flaw: a severe norm disparity between the high-norm visual tokens and the low-norm text tokens. In this work, we present a formal theoretical analysis demonstrating that this imbalance is not a static issue. Instead, it induces an \"asymmetric update dynamic\", where high-norm visual tokens exhibit a ''representational inertia,'' causing them to transform semantically much slower than their textual counterparts. This fundamentally impairs effective cross-modal feature fusion. Our empirical validation across a range of mainstream MLLMs confirms that this theoretical dynamic---the persistence of norm disparity and the resulting asymmetric update rates---is a prevalent phenomenon. Based on this insight, we propose a remarkably simple yet effective solution: inserting a single, carefully initialized LayerNorm layer after the visual projector to enforce norm alignment, suggesting that resolving the architectural imbalance leads to a more holistically capable model.", "title": "The Unseen Bias: How Norm Discrepancy in Pre-Norm MLLMs Leads to  Visual  Information Loss"}, "b": {"brief": ["给模型轻量信心模块", "用小适配模块估计模型不知道什么，再辅助拒答和选择生成路径。", "Lightweight uncertainty modules", "Estimate uncertainty with small adapters to support abstention and generation choices."], "full": "Foundation models demonstrate impressive capabilities but lack principled mechanisms for uncertainty quantification, leading to overconfident predictions and hallucinations on out-of-distribution inputs. We introduce Epistemic Adapters, a parameter-efficient framework that retrofits pretrained large language models with explicit uncertainty awareness. Our approach learns lightweight adapter modules that map internal activations to calibrated epistemic uncertainty estimates without modifying the base model weights. During inference, these uncertainty representations enable the model to distinguish between confident knowledge recall, uncertain reasoning, and complete ignorance. The framework supports three key capabilities: selective abstention on high-uncertainty queries, uncertainty-guided beam search that favors lower-entropy generation paths, and active learning mechanisms that identify informative examples for human feedback. By decoupling uncertainty estimation from the primary forward pass, Epistemic Adapters maintain generation quality while providing interpretable confidence scores. This work establishes a foundation for more reliable and transparent deployment of frontier models in high-stakes applications where knowing what the model doesn't know is as critical as what it does.", "title": "LLM-foundation or frontier models, including LLMs-0"}, "expected": 0, "p3": {"i": 8, "pred": 0, "votes": [0, 0, 0, 1, 1, 1], "expected": 0}, "p4": {"i": 8, "pred": 0, "votes": [0, 0, 0, 1, 1, 1], "expected": 0}}, {"row": 10, "id": "11", "a": {"brief": ["让知识有时间通道", "为不同时期的知识建立处理通道，再按问题选择或组合。", "Time-aware knowledge channels", "Route questions through lightweight channels representing different temporal states."], "full": "Large language models struggle with temporal knowledge dynamics, treating information as static despite operating in a world where facts, scientific understanding, and societal contexts continuously evolve. We introduce Temporal Knowledge Channels (TKC), a novel architecture that extends foundation models with parallel processing pathways encoding knowledge at different temporal states. Unlike retrieval-augmented approaches that externalize temporal information, TKC embeds temporal awareness directly into the model's computation graph through learned gating mechanisms that route queries through temporally-appropriate knowledge channels. Each channel maintains a lightweight adapter layer trained on time-stamped corpora, while a temporal reasoning module learns to select and compose information across channels based on explicit or inferred temporal context. This architecture enables models to reason about knowledge evolution, answer counterfactual historical queries, and maintain multiple valid but temporally-distinct world models simultaneously. TKC preserves the general capabilities of the base foundation model while adding structured temporal reasoning, offering a path toward continually-learning systems that understand not just what is true, but when it became true and how knowledge changes over time.", "title": "LLM-foundation or frontier models, including LLMs-3"}, "b": {"brief": ["测量模型用了多少推理", "比较完整模型与浅层预测头的输出差异，分析并调节生成过程。", "Measuring reasoning effort", "Compare full and shallow prediction distributions to measure and steer computation."], "full": "Measuring the in-context computational effort of language models is a key challenge, as metrics like next-token loss fail to capture reasoning complexity. Prior methods based on latent state compressibility can be invasive and unstable. We propose Multiple Token Divergence (MTD), a simple measure of computational effort defined as the KL divergence between a model's full output distribution and that of a shallow, auxiliary prediction head. MTD can be computed directly from pre-trained models with multiple prediction heads, requiring no additional training. Building on this, we introduce Divergence Steering, a novel decoding method to control the computational character of generated text. MTD provides a practical, lightweight tool for analyzing and steering the computational dynamics of language models.", "title": "Multiple Token Divergence: Measuring and Steering In-Context Computation Density"}, "expected": 1, "p3": {"i": 10, "pred": null, "votes": [0, 0, 0, 0, 0, 0], "expected": 1}, "p4": {"i": 10, "pred": 0, "votes": [0, 0, 0, 1, 1, 1], "expected": 1}}, {"row": 12, "id": "13", "a": {"brief": ["从内部轨迹估计不确定性", "观察各层隐藏表示如何变化，用轻量预测器判断回答的不确定性。", "Uncertainty from internal trajectories", "Estimate uncertainty from geometric changes in hidden representations across layers."], "full": "Large language models generate fluent responses even when uncertain, producing hallucinations that undermine trust in high-stakes applications. Existing uncertainty quantification methods rely on expensive ensembles, multiple sampling passes, or external verifiers that scale poorly with model size. We introduce Layerwise Uncertainty Estimation (LUE), a principled framework that exploits the hierarchical representation structure within transformer-based foundation models to estimate epistemic uncertainty at inference time with minimal overhead. Our approach constructs uncertainty signals by analyzing the geometric properties of hidden state trajectories across layers, capturing how semantic refinement and representational consistency evolve during the forward pass. We identify that uncertainty manifests as increased trajectory curvature and reduced cross-layer alignment in regions where the model extrapolates beyond its training distribution. By learning a lightweight uncertainty predictor on these geometric features through self-supervised pretraining on diverse prompts, LUE provides calibrated confidence scores without modifying the base model or requiring labeled uncertainty data, enabling selective abstention and improved reliability in open-domain question answering, medical diagnosis, and code generation scenarios.", "title": "LLM-foundation or frontier models, including LLMs-5"}, "b": {"brief": ["加速记忆型模型训练", "先用分层记忆提高并行训练效率，再通过短暂微调恢复推理表现。", "Faster training for memory models", "Use hierarchical memory for efficient parallel pretraining followed by brief fine-tuning."], "full": "Recurrent neural networks (RNNs) with deep test-time memorization modules, such as Titans and TTT, represent a promising, linearly-scaling paradigm distinct from Transformers. While these expressive models do not yet match the peak performance of state-of-the-art Transformers, their potential has been largely untapped due to prohibitively slow training and low hardware utilization.\nExisting parallelization methods force a fundamental conflict governed by the chunksize hyperparameter: large chunks boost speed but degrade performance, necessitating a fixed, suboptimal compromise. To solve this challenge, we introduce TNT, a novel training paradigm that decouples training efficiency from inference performance through a two-stage process. Stage one is an efficiency-focused pre-training phase utilizing a hierarchical memory. A global module processes large, hardware-friendly chunks for long-range context, while multiple parallel local modules handle fine-grained details. Crucially, by periodically resetting local memory states, we break sequential dependencies to enable massive context parallelization. Stage two is a brief fine-tuning phase where only the local memory modules are adapted to a smaller, high-resolution chunksize, maximizing accuracy with minimal overhead. This approach removes a critical scalability barrier, establishing a practical foundation for developing expressive RNNs and facilitating future work to close the performance gap with Transformers.", "title": "TNT: Improving Chunkwise Training for Test-Time Memorization"}, "expected": 1, "p3": {"i": 12, "pred": 1, "votes": [1, 1, 1, 0, 0, 0], "expected": 1}, "p4": {"i": 12, "pred": 1, "votes": [0, 0, 1, 0, 0, 0], "expected": 1}}, {"row": 13, "id": "14", "a": {"brief": ["让知识的信心随时间变化", "从带时间的信息中学习知识如何演变，区别稳定与容易过时的知识。", "Confidence as knowledge ages", "Learn temporal patterns to distinguish stable knowledge from information that may become outdated."], "full": "Foundation models encode vast amounts of knowledge but struggle with temporal reasoning about knowledge evolution and principled uncertainty quantification over time. We introduce Temporal Epistemic Adaptation (TEA), a framework that augments large language models with explicit meta-learning over knowledge dynamics. Rather than treating information as static, TEA trains models to recognize and internalize patterns in how knowledge evolves—including scientific consensus shifts, terminology drift, and the refinement of causal models across domains. By learning these meta-patterns during pre-training on temporally-annotated corpora, the model develops structured priors for reasoning about epistemic uncertainty and knowledge decay. TEA enables foundation models to explicitly represent confidence bounds that degrade appropriately with temporal distance, distinguish stable from volatile knowledge domains, and generate calibrated predictions about information currency. This approach transforms static knowledge retrieval into dynamic epistemic reasoning, allowing models to better characterize the boundaries of their knowledge and adapt their responses based on learned patterns of how different types of information change over time.", "title": "LLM-foundation or frontier models, including LLMs-6"}, "b": {"brief": ["研究纯文字训练里的视觉能力", "分析语言模型为何没看过图像也有视觉知识，并区分感知与推理来源。", "Visual abilities learned from text", "Separate perception and reasoning priors that emerge during language pretraining."], "full": "Large Language Models (LLMs), despite being trained on text alone, surprisingly develop rich visual priors. These priors allow latent visual capabilities to be unlocked for vision tasks with a relatively small amount of multimodal data, and to perform symbolic visual generation tasks without ever having seen an image. Through systematic analysis, we reveal that visual priors—the implicit, emergent knowledge about the visual world acquired during language pre-training—are composed of separable perception and reasoning priors with unique scaling trends and origins. We show that an LLM's latent visual reasoning ability is predominantly developed by pre-training on reasoning-centric data (e.g., code, math, academia) and scales progressively. This reasoning prior acquired from language pre-training is transferable and universally applicable to visual reasoning. In contrast, the perception prior emerges more diffusely from broad corpora, and perception ability is more sensitive to the vision encoder and visual instruction tuning data. In parallel, text describing the visual world proves crucial, though its performance impact saturates rapidly. Leveraging these insights, we propose a data-centric recipe for pre-training vision-aware LLMs. Our findings are grounded in over 100 controlled experiments consuming 500,000 GPU-hours, spanning the full MLLM construction pipeline—from LLM pre-training to visual alignment and supervised multimodal fine-tuning—across five model scales, a wide range of data categories and mixtures, and multiple adaptation setups. Along with our main findings, we also propose and investigate several hypotheses, and introduce a Multi-Level Existence Bench (MLE-Bench) to facilitate future research. Together, this work provides a new way of deliberately cultivating visual priors from language pre-training, paving the way for the next generation of multimodal LLMs.", "title": "Learning to See Before Seeing: Demystifying LLM Visual Priors from Language Pre-training"}, "expected": 1, "p3": {"i": 13, "pred": 1, "votes": [1, 1, 1, 0, 0, 0], "expected": 1}, "p4": {"i": 13, "pred": 0, "votes": [0, 0, 0, 0, 0, 1], "expected": 1}}, {"row": 14, "id": "15", "a": {"brief": ["压缩大型专家模型", "把专家权重分解为专属部分与共享基矩阵的组合，减少部署内存。", "Compressing expert models", "Factor expert weights into individual components and shared basis matrices."], "full": "The Mixture-of-Experts (MoE) architecture has become a predominant paradigm for scaling large language models (LLMs). Despite offering strong performance and computational efficiency, large MoE-based LLMs like DeepSeek-V3-0324 and Kimi-K2-Instruct present serious challenges due to substantial memory requirements in deployment. While recent works have explored MoE compression to address this issue, existing methods often suffer from considerable accuracy drops even at modest compression rates. This paper introduces a novel Mixture-of-Basis-Experts (MoBE) method that achieves model compression while incurring minimal accuracy drops. Specifically, each up/gate matrix in an expert is decomposed via a rank decomposition as W = AB, where matrix A is unique to each expert. The relatively larger matrix B is further reparameterized as a linear combination of basis matrices {Bi} shared across all experts within a given MoE layer. The factorization is learned by minimizing the reconstruction error relative to the original weight matrices.", "title": "MoBE: Mixture-of-Basis-Experts for Compressing MoE-based LLMs"}, "b": {"brief": ["让知识沿时间更新", "用带有效期的知识图谱和轻量模块更新相关事实，并维持一致性。", "Updating facts over time", "Use time-stamped knowledge and lightweight interventions to update related facts consistently."], "full": "Foundation models encode vast knowledge within their parameters, yet this knowledge remains static after pretraining, creating a growing gap between model capabilities and an evolving world. We introduce Temporal Knowledge Modulation (TKM), a framework enabling foundation models to continuously integrate new factual knowledge without catastrophic forgetting or full retraining. TKM augments pretrained LLMs with a lightweight temporal knowledge module that learns to modulate internal representations based on structured knowledge graphs timestamped with validity periods. Unlike retrieval-augmented generation, which provides external context, our approach updates the model's parametric knowledge through targeted interventions in the representation space. The temporal module learns consistency constraints that propagate updates across semantically related facts, ensuring logical coherence as knowledge evolves. By separating stable general-purpose capabilities from dynamic factual knowledge, TKM enables models to track scientific discoveries, world events, and domain-specific information streams while preserving their original competencies. This paradigm shift from static to dynamic parametric knowledge opens new possibilities for maintaining relevant, up-to-date foundation models in rapidly changing domains.", "title": "LLM-foundation or frontier models, including LLMs-8"}, "expected": 0, "p3": {"i": 14, "pred": 1, "votes": [0, 1, 0, 0, 0, 0], "expected": 0}, "p4": {"i": 14, "pred": null, "votes": [0, 0, 0, 0, 0, 0], "expected": 0}}, {"row": 15, "id": "16", "a": {"brief": ["让AI边推理边生成记忆", "监控何时需要回忆，再生成潜在记忆序列辅助当前推理。", "Generating memory during reasoning", "Trigger memory when needed and weave latent memory sequences into ongoing reasoning."], "full": "Agent memory shapes how Large Language Model (LLM)-powered agents, akin to the human brain, progressively refine themselves through environment interactions. Existing paradigms remain constrained: parametric memory forcibly adjusts model parameters, and retrieval-based memory externalizes experience into structured databases, yet neither captures the fluid interweaving of reasoning and memory that underlies human cognition. To address this gap, we propose MemGen, a dynamic generative memory framework that equips agents with a human-esque cognitive faculty. It consists of a \\textit{memory trigger}, which monitors the agent's reasoning state to decide explicit memory invocation, and a \\textit{memory weaver}, which takes the agent's current state as stimulus to construct a latent token sequence as machine-native memory to enrich its reasoning. In this way, MemGen enables agents to recall and augment latent memory throughout reasoning, producing a tightly interwoven cycle of memory and cognition. More importantly, we find that without explicit supervision, MemGen spontaneously evolves distinct human-like memory faculties, including planning memory, procedural memory, and working memory, suggesting an emergent trajectory toward more naturalistic forms of machine cognition.", "title": "MemGen: Weaving Generative Latent Memory for Self-Evolving Agents"}, "b": {"brief": ["让模型复用推理模板", "学习和检索抽象解题结构，再把它们用于新的问题。", "Reusable reasoning templates", "Learn and retrieve abstract reasoning schemas for new problem instances."], "full": "We introduce Schema-Grounded Language Models, a novel architecture that enhances foundation models with explicit mechanisms for learning and applying abstract reasoning patterns. While contemporary LLMs excel at pattern matching and surface-level associations, they struggle with systematic generalization and compositional reasoning tasks that require principled abstraction. Our approach augments transformer-based models with a schema memory module that automatically extracts, encodes, and retrieves reusable reasoning templates from training data and in-context examples. During inference, the model dynamically conditions its generation on retrieved schemas, adapting them to novel problem instances through a lightweight cross-attention mechanism. This modular design enables explicit separation between learning abstract problem structures and instantiating them with specific content, facilitating better out-of-distribution generalization. The schema representations remain differentiable and are jointly optimized with the language model, preserving end-to-end trainability while introducing structured inductive biases. By bridging neural flexibility with compositional reasoning, our framework addresses fundamental limitations in how foundation models handle abstraction, logical consistency, and knowledge transfer across diverse reasoning domains.", "title": "LLM-foundation or frontier models, including LLMs-1"}, "expected": 0, "p3": {"i": 15, "pred": 0, "votes": [0, 0, 0, 1, 1, 1], "expected": 0}, "p4": {"i": 15, "pred": 0, "votes": [0, 0, 0, 1, 1, 1], "expected": 0}}, {"row": 16, "id": "17", "a": {"brief": ["给模型添加可组合技能", "通过轻量技能模块、路由和元学习，快速改变模型的行为与推理方式。", "Composable model skills", "Use lightweight skill modules, routing and meta-learning to adapt model behavior."], "full": "Foundation models excel at general-purpose tasks but struggle to adapt their reasoning strategies and behavioral patterns without costly retraining. While retrieval-augmented generation addresses factual knowledge gaps, it cannot inject new cognitive skills or modify inferential processes. We propose Meta-Modular Foundation Models, a framework that treats pre-trained LLMs as computational substrates augmented with dynamically composable skill modules. These lightweight modules—implemented as context-dependent routing mechanisms and specialized adapter networks—enable rapid behavioral adaptation while preserving core capabilities. Our approach introduces a meta-learning protocol that allows models to internalize new reasoning patterns from minimal task demonstrations, selectively activating relevant skill modules during inference. Unlike fine-tuning, which entangles new knowledge with existing parameters, our architecture maintains explicit separation between general-purpose representations and specialized computational pathways. This enables continuous capability expansion, domain-specific customization, and multi-tenant deployments where different users access distinct skill compositions from a shared foundation model. Meta-Modular Foundation Models provide a path toward truly adaptive AI systems that evolve their behavioral repertoire without sacrificing generality or requiring prohibitive computational resources.", "title": "LLM-foundation or frontier models, including LLMs-18"}, "b": {"brief": ["挑出更有价值的推理数据", "提炼可复用推理模式，再结合模式链与词的不确定性筛选训练数据。", "Selecting valuable reasoning data", "Extract reusable reasoning patterns and use them to select informative training examples."], "full": "Recent progress in large reasoning models for challenging mathematical reasoning has been driven by reinforcement learning (RL). Incorporating long chain-of-thought (CoT) data during mid-training has also been shown to substantially improve reasoning depth. However, current approaches often utilize CoT data indiscriminately, leaving open the critical question of which data types most effectively enhance model reasoning capabilities. In this paper, we define the foundation model's reasoning potential for the first time as the inverse of the number of independent attempts required to correctly answer the question, which is strongly correlated with the final model performance. We then propose utilizing diverse data enriched with high-value reasoning patterns to expand the reasoning potential. Specifically, we abstract atomic reasoning patterns from CoT sequences, characterized by commonality and inductive capabilities, and use them to construct a core reference set enriched with valuable reasoning patterns. Furthermore, we propose a dual-granularity algorithm involving chains of reasoning patterns and token entropy, efficiently selecting high-value CoT data (CoTP) from the data pool that aligns with the core set, thereby training models to master reasoning effectively.", "title": "Expanding Reasoning Potential in Foundation Model by Learning Diverse Chains of Thought Patterns"}, "expected": 1, "p3": {"i": 16, "pred": null, "votes": [0, 0, 0, 0, 0, 0], "expected": 1}, "p4": {"i": 16, "pred": null, "votes": [0, 0, 0, 0, 0, 0], "expected": 1}}]};

function renderGame(){const c=current();for(const side of ['a','b']){const brief=c[side].brief;$('title-'+side).textContent=brief[lang==='zh'?0:2];$('brief-'+side).textContent=brief[lang==='zh'?1:3];$('full-'+side).textContent=c[side].full;$('idea-'+side).classList.toggle('selected',choice===(side==='a'?0:1));$('choose-'+side).setAttribute('aria-pressed',String(choice===(side==='a'?0:1)));$('choose-'+side).disabled=revealed}$('idea-a').style.order=swapped?2:1;$('idea-b').style.order=swapped?1:2;$('reveal').disabled=choice===null||revealed;$('hint').textContent=choice===null?L('先按直觉选一个，不确定也没关系。','Choose intuitively. Uncertainty is welcome.'):L(`你的选择：${winner(choice)}。这不是标准答案。`,`Your choice: ${winner(choice)}. There is no marked right answer here.`);$('score').textContent=L(`预测命中 ${[...scores.values()].filter(Boolean).length} / ${scores.size}`,`Predictions ${[...scores.values()].filter(Boolean).length} / ${scores.size}`);$('result').hidden=!revealed;if(!revealed)return;$('q3').textContent=L('第一轮 P3：哪条想法被评审认为是新颖的？','Round1 · P3: which idea did reviewers judge novel?');$('v3').textContent='P3 · '+winner(c.p3.pred);renderVotes('votes3',c.p3.votes);$('predict').hidden=guess!==null;$('second').hidden=guess===null;if(guess===null)return;$('q4').textContent=L('第二轮 P4：哪条想法是新颖的？','Round2 · P4: which idea is novel?');$('v4').textContent='P4 · '+winner(c.p4.pred);renderVotes('votes4',c.p4.votes);$('bars').innerHTML=['p3','p4'].map(k=>`<div class="barrow"><strong>${k.toUpperCase()}</strong><div class="track"><div class="fill" style="width:${aVotes(c[k].votes)/6*100}%"></div></div><span>A ${aVotes(c[k].votes)} / 6</span></div>`).join('');const type=classify(c),ok=guess===type;$('feedback').textContent=(ok?L('猜中了！','You predicted it!'):L('结果有点意外。','A surprising result.'))+' '+L(type==='same'?'AI保留了原来的赢家。':type==='flip'?'AI改选了另一个想法。':'至少一轮出现平局。',type==='same'?'The winner stayed the same.':type==='flip'?'The winner changed.':'At least one round tied.');$('explain').textContent=L(`基准参考选择：${winner(c.expected)}。${type==='same'?'稳定不等于符合参考标签。':type==='tie'?'平局来自六票对半，不是接口失败。':'同一对完整输入，出现了不同选择。'} P3预测评审判断，P4直接评新颖性，目标框架也不同。`,`Benchmark reference: ${winner(c.expected)}. ${type==='same'?'Consistency does not guarantee reference agreement.':type==='tie'?'A tie is a3–3 vote, not an API failure.':'The same full ideas received different selections.'} P3 predicts reviewers’ judgments; P4 assesses novelty directly, so the target framing differs.`)}
function reset(){choice=null;revealed=false;guess=null;swapped=false;renderGame()}function choose(v){if(revealed)return;choice=v;renderGame()}
$('choose-a').onclick=()=>choose(0);$('choose-b').onclick=()=>choose(1);$('swap').onclick=()=>{swapped=!swapped;renderGame()};$('case').onchange=e=>{index=+e.target.value;reset()};$('reveal').onclick=()=>{if(choice===null)return;revealed=true;renderGame()};document.querySelectorAll('[data-guess]').forEach(b=>b.onclick=()=>{if(!revealed||guess!==null)return;guess=b.dataset.guess;if(!scores.has(current().row))scores.set(current().row,guess===classify(current()));renderGame()});$('next').onclick=()=>{index=(index+1)%DATA.cases.length;$('case').value=index;reset()};$('reset').onclick=reset;
const labs={prompt:{labels:['Ref','P3','P4'],values:[66.2338,66.8831,41.5584],big:'102 → 64',label:['相同154对想法，与基准一致的判决数','Matching decisions on the same154 pairs'],take:['只改提问框架，少了38个正确判决。','A framing change produced38 fewer matching decisions.'],explain:['固定DeepSeek和想法。参考提示词、预测评审判断的P3、直接问新颖性的P4得到不同结果。“正确”指符合基准标签。','Keep DeepSeek and ideas fixed. Reference, reviewer-prediction P3 and direct-novelty P4 differ. “Correct” means agreement with benchmark labels.']},votes:{labels:['1 / order','3 / order'],values:[60.6061,66.2338],big:'+5.6 pp',label:['Human+Generated基准一致率变化','Change in Human+Generated agreement'],take:['重复投票有帮助，但不是可靠性保证。','Repeated votes helped, without guaranteeing reliability.'],explain:['无聚合指标取三组已保存子运行的均值，每组每种顺序1票；完整聚合每种顺序3票。没有重复付费运行。','The non-aggregated metric averages three saved subruns with one vote per order; full aggregation uses three per order. No fresh calls were needed.']},format:{labels:['Abstract','Plan'],values:[66.8831,55.8442],big:'66.9 → 55.8',label:['固定P3时的基准一致率（%）','Benchmark agreement (%) with P3 fixed'],take:['结构化计划没有自动改善判断。','Structured plans did not automatically improve judgments.'],explain:['把摘要改写成“目标＋机制”，其余保持不变。这个结果不代表研究计划格式普遍更差。','Change abstracts to objective/mechanism plans, keeping other settings fixed. This does not show that plan formats are universally worse.']},source:{labels:['Sonnet4.5','Opus4.5','GPT-5.4'],values:[66.2338,51.2987,18.1818],big:'66.2 → 18.2',label:['评委始终是DeepSeek，一致率（%）','Agreement (%); DeepSeek remains the judge'],take:['换来源，评测表现会明显不同。','The idea source strongly affects evaluation outcomes.'],explain:['生成想法来自原作者发布的数据，正例固定。分数降低不证明这些想法真的更新颖，也可能反映弱标签问题。','Generated ideas come from the original benchmark; positives stay fixed. Lower agreement does not prove greater originality and may reflect weak labels.']}};

dated. Use a fresh idea generator to test transfer beyond development data.'],['比较完全重复、经过核查的同义提问和交换顺序，把任务目标变化单独处理。','Compare exact repeats, checked same-task paraphrases and order swaps; separate target changes.'],['重复投票、位置冲突和同义提问分歧都是候选信号，需要对照实验。','Vote margin, position conflicts and paraphrase disagreement are candidate signals requiring comparison.'],['例如只有20%的案例可复核，测试哪种规则先找到更多错误。20%是示例预算。','At an illustrative20% review budget, test which rule catches more errors first.'],['测保留判决的错误率、人工复核捕错和额外API成本。允许结果证明方法没有帮助。','Measure retained error, error capture and API cost, including the possibility of no improvement.']]}};

function flowSvg(type,active=4,interactive=false,vertical=false){const f=flows[type],title=f.name[lang==='zh'?0:1],w=vertical?420:1440,h=vertical?1070:370;let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(title)}"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#9aada7"/></marker></defs><rect width="${w}" height="${h}" rx="20" fill="#fffef9"/><text x="30" y="43" font-size="${vertical?17:18}" font-family="Arial,Microsoft YaHei,sans-serif" fill="#087e78">${esc(title)}</text>`;f.titles.forEach((t,i)=>{const x=vertical?55:40+i*280,y=vertical?85+i*180:92,bw=vertical?310:230,on=i===active;svg+=`${i<4?(vertical?`<path d="M210 ${y+138}V${y+170}" stroke="#9aada7" stroke-width="2" marker-end="url(#arrow)"/>`:`<path d="M${x+230} 159H${x+265}" stroke="#9aada7" stroke-width="2" marker-end="url(#arrow)"/>`):''}<g ${interactive?`data-node="${i}" role="button" tabindex="0" aria-label="${esc(t[lang==='zh'?0:1])}" style="cursor:pointer"`:''}><rect x="${x}" y="${y}" width="${bw}" height="138" rx="18" fill="${on?'#143042':i<active?'#e3ede5':'#f1f4ed'}" stroke="${on?'#143042':'#cfdcd3'}"/><circle cx="${x+32}" cy="${y+32}" r="14" fill="${on?'#d65e37':'#087e78'}"/><text x="${x+32}" y="${y+37}" text-anchor="middle" fill="white" font-size="14" font-family="Arial">${i+1}</text><text x="${x+bw/2}" y="${y+88}" text-anchor="middle" fill="${on?'#fffef9':'#143042'}" font-size="${lang==='zh'?23:19}" font-family="Arial,Microsoft YaHei,sans-serif" font-weight="600">${esc(t[lang==='zh'?0:1])}</text></g>`});svg+=`<text x="30" y="${h-32}" font-size="${vertical?14:16}" font-family="Arial,Microsoft YaHei,sans-serif" fill="#5d6f76">${type==='future'?L('后续设想 · 尚未验证','Proposed study · Not yet validated'):L('生成想法与评判想法，是不同环节','Generating ideas and judging ideas are different tasks')}</text></svg>`;return svg}
window.LabEngine.flowSvg=flowSvg;window.LabEngine.setLanguage=v=>{lang=v;updateLanguage()};
function renderFlow(){$('flowbox').innerHTML=flowSvg(flow,step,true,window.innerWidth<760);$('detail').textContent=flows[flow].details[step][lang==='zh'?0:1];$('step-count').textContent=`0${step+1} / 05`;document.querySelectorAll('[data-flow]').forEach(b=>{b.classList.toggle('active',b.dataset.flow===flow);b.setAttribute('aria-pressed',String(b.dataset.flow===flow))});$('flowbox').querySelectorAll('[data-node]').forEach(n=>{n.onclick=()=>{step=+n.dataset.node;renderFlow()};n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();step=+n.dataset.node;renderFlow()}}})}
function stop(){if(timer){clearInterval(timer);timer=null}$('play').textContent=L('自动播放','Auto play')}
$('flow-next').onclick=()=>{step=(step+1)%5;renderFlow()};$('flow-reset').onclick=()=>{stop();step=0;renderFlow()};$('play').onclick=()=>{if(timer){stop();return}$('play').textContent=L('暂停','Pause');timer=setInterval(()=>{step=(step+1)%5;renderFlow()},1800)};document.querySelectorAll('[data-flow]').forEach(b=>b.onclick=()=>{stop();flow=b.dataset.flow;step=0;renderFlow()});
$('download').onclick=()=>{const url=URL.createObjectURL(new Blob([flowSvg(flow,step)],{type:'image/svg+xml'})),a=document.createElement('a');a.href=url;a.download=`novelty-${flow}-${lang}.svg`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
function setTab(tab){stop();['game','lab','flow'].forEach(id=>$(id).hidden=id!==tab);document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-selected',String(b.dataset.tab===tab))})}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$('lang').onclick=()=>{lang=lang==='zh'?'en':'zh';stop();updateLanguage()};$('present').onclick=()=>{document.body.classList.toggle('present');$('present').setAttribute('aria-pressed',String(document.body.classList.contains('present')))};window.addEventListener('resize',()=>{if(!$('flow').hidden)renderFlow()});updateLanguage();

</script></body></html>
