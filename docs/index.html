</style></head><body><header><div class="brand"><b>◒</b> novelty<span>lab</span></div><div class="actions"><button class="quiet" id="lang">EN / 中文</button><button class="quiet" id="present" data-zh="演示模式" data-en="Presentation mode">演示模式</button></div></header><main><section class="hero"><div><div class="eyebrow">AN EXPERIMENT YOU CAN PLAY</div><h1><span data-zh="同一个想法，换个问法，" data-en="Same ideas. New question.">同一个想法，换个问法，</span><em data-zh="赢家会变吗？" data-en="A different winner?">赢家会变吗？</em></h1><p class="lead" data-zh="当AI给出一堆研究想法，我们可能再请一个AI挑出最新颖的。先别急着相信它——来当一回评委。" data-en="An AI generates research ideas. Another chooses the most novel. Before trusting that reviewer, try being the judge yourself."></p></div><svg viewBox="0 0 450 280" aria-hidden="true"><ellipse cx="225" cy="242" rx="155" ry="13" fill="#e0e7df"/><circle cx="225" cy="126" r="103" fill="#e5ece4"/><g class="float"><rect x="57" y="83" width="87" height="117" rx="10" fill="#fffef9" stroke="#bccdc6" transform="rotate(-12 100 140)"/><text x="88" y="135" font-size="33" fill="#087e78" font-family="Arial" font-weight="bold">A</text><path d="M80 153h38m-38 10h29" stroke="#a4b6b4" stroke-width="3"/><rect x="307" y="72" width="87" height="117" rx="10" fill="#fffef9" stroke="#bccdc6" transform="rotate(12 350 130)"/><text x="335" y="127" font-size="33" fill="#d65e37" font-family="Arial" font-weight="bold">B</text><path d="M326 146h38m-38 10h29" stroke="#a4b6b4" stroke-width="3"/></g><path d="M225 77v-18m-8 0h16" stroke="#143042" stroke-width="4"/><rect x="168" y="81" width="114" height="91" rx="25" fill="#143042"/><rect x="180" y="99" width="90" height="42" rx="17" fill="#f4f1e8"/><circle cx="204" cy="119" r="7" fill="#087e78"/><circle cx="246" cy="119" r="7" fill="#d65e37"/><path d="M208 154h34" stroke="#f4f1e8" stroke-width="4" stroke-linecap="round"/><path d="M207 177v44m36-44v44m-59 3h36m11 0h36" stroke="#143042" stroke-width="9" stroke-linecap="round"/><path d="M160 119l-15 12m145-12 15 12" stroke="#143042" stroke-width="6" stroke-linecap="round"/><text x="225" y="45" font-family="Arial" font-size="25" fill="#d65e37" text-anchor="middle">?</text></svg></section><nav aria-label="Sections"><button class="active" data-tab="game" aria-selected="true"><small>01</small><span data-zh="你来当评委" data-en="Be the judge"></span></button><button data-tab="lab" aria-selected="false"><small>02</small><span data-zh="规则实验室" data-en="Rule laboratory"></span></button><button data-tab="flow" aria-selected="false"><small>03</small><span data-zh="会动的实验流程" data-en="The research flow"></span></button></nav>
<section id="game"><div class="head"><div><h2 data-zh="你觉得哪条研究想法更新颖？" data-en="Which research idea do you think is more novel?"></h2><p class="sub" data-zh="第1步：选你觉得更有原创性的想法。第2步：猜AI换问法后会不会改判。积分只看第2步。" data-en="Step1: choose the idea you find more original. Step2: predict what the AI does after rewording. Only step2 is scored."></p></div><div class="controls"><select id="case" aria-label="Case"></select><span id="score" class="counter"></span><button class="quiet" id="swap" data-zh="交换展示位置" data-en="Swap cards"></button></div></div><div class="pair" id="pair"><article class="idea" id="idea-a"><div class="letter">IDEA A · 0</div><h3 id="title-a"></h3><p class="brief" id="brief-a"></p><button class="choose" id="choose-a" data-zh="我认为A更新颖" data-en="I think A is more novel"></button><details><summary data-zh="模型收到的完整原文" data-en="Full original input"></summary><p class="full" id="full-a"></p></details></article><article class="idea" id="idea-b"><div class="letter">IDEA B · 1</div><h3 id="title-b"></h3><p class="brief" id="brief-b"></p><button class="choose" id="choose-b" data-zh="我认为B更新颖" data-en="I think B is more novel"></button><details><summary data-zh="模型收到的完整原文" data-en="Full original input"></summary><p class="full" id="full-b"></p></details></article></div><div class="game-action"><button class="primary" id="reveal" disabled data-zh="揭晓AI的第一轮选择" data-en="Reveal the first decision"></button><span class="hint" id="hint"></span></div><div class="result" id="result" hidden aria-live="polite"><div class="question" id="q3"></div><div class="row"><div class="verdict" id="v3"></div><div class="votes" id="votes3"></div></div><div class="predict" id="predict"><p data-zh="换成直接问“哪条新颖”，AI会怎样？" data-en="If we now ask directly which idea is novel, what happens?"></p><button class="guess" data-guess="same" data-zh="同一个赢家" data-en="Same winner"></button><button class="guess" data-guess="flip" data-zh="换一个赢家" data-en="Different winner"></button><button class="guess" data-guess="tie <section id="lab" hidden><div class="head"><div><h2 data-zh="只改一条规则，看看结果怎么变。" data-en="Change one rule. Inspect the result."></h2><p class="sub" data-zh="已经完成的真实实验数据，没有调用新模型。" data-en="Completed experiment data, without new model calls."></p></div></div><div class="lab-grid"><div class="settings"><button class="rule active" data-rule="prompt"><strong data-zh="换提问方式" data-en="Change the question"></strong><span data-zh="相同154对想法，不同提示词。" data-en="Same154 pairs, different instructions."></span></button><button class="rule" data-rule="votes"><strong data-zh="重复投票" data-en="Repeat the vote"></strong><span data-zh="每种顺序1票或3票。" data-en="One or three votes per order."></span></button><button class="rule" data-rule="format"><strong data-zh="换成研究计划" data-en="Use a research plan"></strong><span data-zh="摘要，或目标＋机制。" data-en="Abstract versus goal + mechanism."></span></button><button class="rule" data-rule="source"><strong data-zh="换想法生成器" data-en="Change the idea generator"></strong><span data-zh="DeepSeek评委不变。" data-en="DeepSeek remains the judge."></span></button></div><div class="lab-box"><div class="eyebrow" data-zh="已完成实验 · 真实数据" data-en="COMPLETED EXPERIMENT · REAL DATA"></div><div class="big" id="number"></div><div class="sub" id="number-label"></div><div class="chart" id="chart"></div><h3 id="takeaway"></h3><p class="explain" id="lab-explain"></p></div></div><p class="note" data-zh="纵轴：成对判决与基准的一致率，平局计0。P3预测评审判断，P4直接判断新颖性，框架与目标也有区别。" data-en="Pairwise agreement with benchmark labels; ties score zero. P3 predicts reviewers’ judgments, while P4 assesses novelty directly, so framing and target differ."></p></section>
<section id="flow" hidden><div class="head"><div><h2 data-zh="把研究过程连起来。" data-en="See how the research fits together."></h2><p class="sub" data-zh="点击节点，或者逐步播放。可下载SVG用于PPT。" data-en="Select a node or step through. Download SVG diagrams for slides."></p></div></div><div class="modes"><button class="active" data-flow="study" data-zh="原文受控实验" data-en="Controlled study"></button><button data-flow="application" data-zh="AI科研中用在哪里" data-en="Use in AI research"></button><button data-flow="future" data-zh="我的后续研究设想" data-en="My proposed study"></button></div><div class="flowbox" id="flowbox"></div><div class="flow-controls"><button class="primary" id="flow-next" data-zh="下一步" data-en="Next step"></button><button class="quiet" id="play" data-zh="自动播放" data-en="Auto play"></button><button class="quiet" id="flow-reset" data-zh="回到起点" data-en="Start again"></button><button class="quiet" id="download" data-zh="下载流程图SVG" data-en="Download SVG"></button><span id="step-count" class="counter"></span></div><p class="detail" id="detail" aria-live="polite"></p></section></main><footer><span>Nuozhou Wang · XJTLU · Novelty evaluation</span><span><a href="https://github.com/Viego051115/novelty-eval-replication" target="_blank" rel="noopener">Experiment records ↗</a> · <span data-zh="离线运行 · 无API费用" data-en="Runs offline · No API charges"></span></span></footer><script>const DATA={
  "cases": [
    {
      "row": 1,
      "id": "1",
      "a": {
        "brief": [
          "协作画图的AI代理",
          "分析数据、规划图表、编写代码，再检查和改进图表。",
          "Collaborative chart agents",
          "Inspect data, plan a chart, write code and refine the visualization."
        ],
        "full": "Deep research has revolutionized data analysis, yet data scientists still devote substantial time to manually crafting visualizations, highlighting the need for robust automation from natural language queries. However, current systems struggle with complex datasets containing multiple files and iterative refinement. Existing approaches, including simple single- or multi-agent systems, often oversimplify the task, focusing on initial query parsing while failing to robustly manage data complexity, code errors, or final visualization quality. In this paper, we reframe this challenge as a collaborative multi-agent problem. We introduce CoDA, a multi-agent system that employs specialized LLM agents for metadata analysis, task planning, code generation, and self-reflection. We formalize this pipeline, demonstrating how metadata-focused analysis bypasses token limits and quality-driven refinement ensures robustness. This work demonstrates that the future of visualization automation lies not in isolated code generation but in integrated, collaborative agentic workflows.",
        "title": "CoDA: Agentic Systems for Collaborative Data Visualization"
      },
      "b": {
        "brief": [
          "可更新知识的模型",
          "找出一条事实对应的模型参数，一致地修改它，并尽量避免遗忘。",
          "Editable model knowledge",

        ],
        "full": "Foundation models encode vast knowledge within their parameters, yet they remain fundamentally static artifacts that cannot efficiently adapt to new information, correct outdated facts, or refine erroneous beliefs without costly retraining. We introduce Neural Knowledge Substrates, a framework that reimagines foundation model weights as dynamically editable knowledge repositories with principled update mechanisms. Our approach combines three key components: (1) a causal tracing methodology that identifies minimal parameter subsets responsible for specific factual or reasoning behaviors, (2) a consistency-preserving editing operator that performs targeted weight updates while maintaining logical coherence across related knowledge, and (3) a meta-learning protocol that enables models to learn how to assimilate new information without catastrophic forgetting. Unlike existing model editing techniques that treat updates as isolated interventions, our framework enforces compositional consistency constraints and propagates changes through knowledge dependency graphs. This enables foundation models to evolve continuously, incorporating new discoveries, correcting misinformation, and refining their world models while preserving their general capabilities—transforming them from static artifacts into living knowledge systems.",
        "title": "LLM-foundation or frontier models, including LLMs-12"

    {

      "id": "2",
      "a": {
        "brief": [
          "为长文本节省显存",
          "利用注意力中的频率信息判断哪些词最重要，只保留关键内容。",
          "Memory-efficient long context",
          "Use frequency information in attention to identify and retain important tokens."
        ],
        "full": "The deployment of Large Language Models (LLMs) faces a critical bottleneck when handling lengthy inputs: the prohibitive memory footprint of the Key Value (KV) cache. To address this bottleneck, the token pruning paradigm leverages attention sparsity to selectively retain a small, critical subset of tokens. However, existing approaches fall short, with static methods risking irreversible information loss and dynamic strategies employing heuristics that insufficiently capture the query-dependent nature of token importance. We propose FASA, a novel framework that achieves query-aware token eviction by dynamically predicting token importance. FASA stems from a novel insight into RoPE: the discovery of functional sparsity at the frequency-chunk (FC) level. Our key finding is that a small, identifiable subset of \"dominant\" FCs consistently exhibits high contextual agreement with the full attention head. This provides a robust and computationally free proxy for identifying salient tokens. Building on this insight, FASA first identifies a critical set of tokens using dominant FCs, and then performs focused attention computation solely on this pruned subset.",
        "title": "FASA: FREQUENCY-AWARE SPARSE ATTENTION"

      "b": {

        "full": "Foundation models excel at leveraging pre-trained knowledge but struggle to incorporate new information after deployment without costly retraining or architectural modifications. We introduce Selective Neuroplasticity Networks (SNNs), a framework that enables large language models to dynamically assimilate streaming information while preserving their foundational capabilities. Our approach learns a meta-policy that identifies which model components—specific attention heads, feed-forward layers, or parameter subspaces—should adapt to new knowledge versus remain stable. By modeling knowledge integration as a routing problem within the transformer architecture, SNNs create dedicated pathways for new information that minimally interfere with existing representations. The meta-policy is trained via bi-level optimization to maximize both knowledge retention and integration across diverse continual learning scenarios. Unlike retrieval-augmented generation, which maintains external memory, our method internalizes new knowledge directly into model weights through selective, localized updates. This enables foundation models to evolve continuously in deployment, adapting to temporal shifts, user-specific contexts, and private data streams while maintaining their broad pre-trained capabilities across standard benchmarks.",
        "title": "LLM-foundation or frontier models, including LLMs-14"

          "Token-weighted preference training",

        "full": "Aligning Large Language Models (LLMs) with human preferences is crucial for safe and effective AI interactions. While popular methods like Direct Preference Optimization (DPO) have simplified alignment, they remain sensitive to data noise and overlook the differential importance of individual tokens. Existing token-level approaches often rely on probability prediction or simplistic weighting schemes to obtain token importance, which still cannot fully address these issues. To solve this problem, we propose the Token-Importance Guided Direct Preference Optimization (TI-DPO), a framework that achieves fine-grained semantic control through two synergistic innovations. First, we propose a novel hybrid weighting mechanism that combines gradient attribution with a Gaussian prior, ensuring both the accuracy and robustness of token importance scores. Second, we employ a triplet loss to provide structured guidance for the optimization, explicitly guiding model outputs to approach preferred responses and diverge from non-preferred ones.",

        "full": "While Large Language Models (LLMs) hold promise to become autonomous agents, they often explore suboptimally in sequential decision-making. Recent work has sought to enhance this capability via supervised fine-tuning (SFT) or reinforcement learning (RL), improving regret on the classic multi-armed bandit task. However, it remains unclear how these learning methods shape exploration strategies and how well they generalize. We investigate both paradigms by training LLMs with SFT on expert trajectories and RL with a range of tailored reward signals including a strategic, regret-shaped reward to reduce variance, and an algorithmic reward that enables oracle imitation. Behavioral analysis reveals that gains often stem from more sophisticated but greedier exploitation: RL/SFT agents are more prone to early catastrophic failure than pre-trained models, prematurely abandoning exploration. Furthermore, agents trained to imitate UCB learn to outperform their teacher by adopting more exploitative variants. Our findings clarify when each training paradigm is preferable and advocate tailored reward design and evaluation beyond average regret to promote robust exploratory behavior.",
