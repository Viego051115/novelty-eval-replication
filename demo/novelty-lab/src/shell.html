<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Play the novelty judge, replay real DeepSeek votes, and explore the evaluation pipeline."><title>Novelty Lab · 新颖性评委实验室</title><style>__CSS__</style></head><body><header><div class="brand"><b>◒</b> novelty<span>lab</span></div><div class="actions"><button class="quiet" id="lang">EN / 中文</button><button class="quiet" id="present" data-zh="演示模式" data-en="Presentation mode">演示模式</button></div></header><main><section class="hero"><div><div class="eyebrow">AN EXPERIMENT YOU CAN PLAY</div><h1><span data-zh="同一个想法，换个问法，" data-en="Same ideas. New question.">同一个想法，换个问法，</span><em data-zh="赢家会变吗？" data-en="A different winner?">赢家会变吗？</em></h1><p class="lead" data-zh="当AI给出一堆研究想法，我们可能再请一个AI挑出最新颖的。先别急着相信它——来当一回评委。" data-en="An AI generates research ideas. Another chooses the most novel. Before trusting that reviewer, try being the judge yourself."></p></div><svg viewBox="0 0 450 280" aria-hidden="true"><ellipse cx="225" cy="242" rx="155" ry="13" fill="#e0e7df"/><circle cx="225" cy="126" r="103" fill="#e5ece4"/><g class="float"><rect x="57" y="83" width="87" height="117" rx="10" fill="#fffef9" stroke="#bccdc6" transform="rotate(-12 100 140)"/><text x="88" y="135" font-size="33" fill="#087e78" font-family="Arial" font-weight="bold">A</text><path d="M80 153h38m-38 10h29" stroke="#a4b6b4" stroke-width="3"/><rect x="307" y="72" width="87" height="117" rx="10" fill="#fffef9" stroke="#bccdc6" transform="rotate(12 350 130)"/><text x="335" y="127" font-size="33" fill="#d65e37" font-family="Arial" font-weight="bold">B</text><path d="M326 146h38m-38 10h29" stroke="#a4b6b4" stroke-width="3"/></g><path d="M225 77v-18m-8 0h16" stroke="#143042" stroke-width="4"/><rect x="168" y="81" width="114" height="91" rx="25" fill="#143042"/><rect x="180" y="99" width="90" height="42" rx="17" fill="#f4f1e8"/><circle cx="204" cy="119" r="7" fill="#087e78"/><circle cx="246" cy="119" r="7" fill="#d65e37"/><path d="M208 154h34" stroke="#f4f1e8" stroke-width="4" stroke-linecap="round"/><path d="M207 177v44m36-44v44m-59 3h36m11 0h36" stroke="#143042" stroke-width="9" stroke-linecap="round"/><path d="M160 119l-15 12m145-12 15 12" stroke="#143042" stroke-width="6" stroke-linecap="round"/><text x="225" y="45" font-family="Arial" font-size="25" fill="#d65e37" text-anchor="middle">?</text></svg></section><nav aria-label="Sections"><button class="active" data-tab="game" aria-selected="true"><small>01</small><span data-zh="你来当评委" data-en="Be the judge"></span></button><button data-tab="lab" aria-selected="false"><small>02</small><span data-zh="规则实验室" data-en="Rule laboratory"></span></button><button data-tab="flow" aria-selected="false"><small>03</small><span data-zh="会动的实验流程" data-en="The research flow"></span></button></nav>
<section id="game"><div class="head"><div><h2 data-zh="先选一个，再猜AI会不会改口。" data-en="Choose an idea. Will the AI change its mind?"></h2><p class="sub" data-zh="真实DeepSeek保存结果。你的选择不是标准答案，得分只看是否猜中模型的变化。" data-en="Real saved DeepSeek outputs. Your preference has no right answer; points reward predicting the judge’s behavior."></p></div><div class="controls"><select id="case" aria-label="Case"></select><span id="score" class="counter"></span><button class="quiet" id="swap" data-zh="交换展示位置" data-en="Swap cards"></button></div></div><div class="pair" id="pair"><article class="idea" id="idea-a"><div class="letter">IDEA A · 0</div><h3 id="title-a"></h3><p class="brief" id="brief-a"></p><button class="choose" id="choose-a" data-zh="我选A" data-en="I choose A"></button><details><summary data-zh="模型收到的完整原文" data-en="Full original input"></summary><p class="full" id="full-a"></p></details></article><article class="idea" id="idea-b"><div class="letter">IDEA B · 1</div><h3 id="title-b"></h3><p class="brief" id="brief-b"></p><button class="choose" id="choose-b" data-zh="我选B" data-en="I choose B"></button><details><summary data-zh="模型收到的完整原文" data-en="Full original input"></summary><p class="full" id="full-b"></p></details></article></div><div class="game-action"><button class="primary" id="reveal" disabled data-zh="揭晓AI的第一轮选择" data-en="Reveal the first decision"></button><span class="hint" id="hint"></span></div><div class="result" id="result" hidden aria-live="polite"><div class="question" id="q3"></div><div class="row"><div class="verdict" id="v3"></div><div class="votes" id="votes3"></div></div><div class="predict" id="predict"><p data-zh="换成直接问“哪条新颖”，AI会怎样？" data-en="If we now ask directly which idea is novel, what happens?"></p><button class="guess" data-guess="same" data-zh="同一个赢家" data-en="Same winner"></button><button class="guess" data-guess="flip" data-zh="换一个赢家" data-en="Different winner"></button><button class="guess" data-guess="tie" data-zh="至少一轮平局" data-en="A tie in either round"></button></div><div id="second" hidden><div class="question" id="q4" style="margin-top:25px"></div><div class="row"><div class="verdict" id="v4"></div><div class="votes" id="votes4"></div></div><div id="bars"></div><div class="feedback" id="feedback"></div><p class="explain" id="explain"></p><div class="controls"><button class="quiet" id="next" data-zh="下一个真实案例 →" data-en="Next real case →"></button><button class="quiet" id="reset" data-zh="重玩本案例" data-en="Replay this case"></button></div></div></div><p class="note" data-zh="五个精选案例包含改判、不变和平局，不能估计总体翻转率。标签是继承的参考，尤其AI生成负例属于弱假设；稳定也不等于正确。" data-en="Five selected cases include stable, changed and tied decisions, not a population flip-rate estimate. Inherited labels are imperfect, especially for generated negatives. Stability does not imply correctness."></p></section>
<section id="lab" hidden><div class="head"><div><h2 data-zh="只改一条规则，看看结果怎么变。" data-en="Change one rule. Inspect the result."></h2><p class="sub" data-zh="已经完成的真实实验数据，没有调用新模型。" data-en="Completed experiment data, without new model calls."></p></div></div><div class="lab-grid"><div class="settings"><button class="rule active" data-rule="prompt"><strong data-zh="换提问方式" data-en="Change the question"></strong><span data-zh="相同154对想法，不同提示词。" data-en="Same154 pairs, different instructions."></span></button><button class="rule" data-rule="votes"><strong data-zh="重复投票" data-en="Repeat the vote"></strong><span data-zh="每种顺序1票或3票。" data-en="One or three votes per order."></span></button><button class="rule" data-rule="format"><strong data-zh="换成研究计划" data-en="Use a research plan"></strong><span data-zh="摘要，或目标＋机制。" data-en="Abstract versus goal + mechanism."></span></button><button class="rule" data-rule="source"><strong data-zh="换想法生成器" data-en="Change the idea generator"></strong><span data-zh="DeepSeek评委不变。" data-en="DeepSeek remains the judge."></span></button></div><div class="lab-box"><div class="eyebrow" data-zh="已完成实验 · 真实数据" data-en="COMPLETED EXPERIMENT · REAL DATA"></div><div class="big" id="number"></div><div class="sub" id="number-label"></div><div class="chart" id="chart"></div><h3 id="takeaway"></h3><p class="explain" id="lab-explain"></p></div></div><p class="note" data-zh="纵轴：成对判决与基准的一致率，平局计0。P3预测评审判断，P4直接判断新颖性，框架与目标也有区别。" data-en="Pairwise agreement with benchmark labels; ties score zero. P3 predicts reviewers’ judgments, while P4 assesses novelty directly, so framing and target differ."></p></section>
